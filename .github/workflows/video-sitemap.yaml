name: Video Sitemap

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate video-sitemap.xml
        run: node tools/generate-video-sitemap.js
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- video-sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add video-sitemap.xml
            git commit -m "chore: update video-sitemap.xml"
            git push
          else
            echo "No changes to video-sitemap.xml"
          fi
