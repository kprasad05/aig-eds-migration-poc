name: Article RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate article-really-simple-syndication.rss
        run: node tools/generate-article-rss.js
      - name: Commit if changed
        run: |
          git add article-really-simple-syndication.rss
          if ! git diff --cached --quiet -- article-really-simple-syndication.rss; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update article-really-simple-syndication.rss"
            git push
          else
            echo "No changes to article-really-simple-syndication.rss"
          fi
