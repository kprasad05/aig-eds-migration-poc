name: Publish Screenshot POC
on:
  workflow_dispatch:
  repository_dispatch:
    types: [resource-published]

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Show payload
        run: echo '${{ toJSON(github.event.client_payload) }}'

      - name: Build page URL
        id: build_url
        run: |
          PAGE_PATH="${{ github.event.client_payload.path }}"
          ORG="${{ github.event.client_payload.org }}"
          SITE="${{ github.event.client_payload.site }}"

          if [ -z "$PAGE_PATH" ]; then
            PAGE_PATH="/"
          fi

          # strip .md and trailing "home" the way EDS does, minimal version:
          PAGE_PATH="${PAGE_PATH%.md}"

          PAGE_URL="https://main--${SITE}--${ORG}.aem.page${PAGE_PATH}"
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved page URL: $PAGE_URL"

      - name: Call Microlink screenshot API
        id: microlink
        run: |
          curl -s "https://api.microlink.io/?url=${{ steps.build_url.outputs.page_url }}&screenshot=true&meta=true" \
            -o response.json
          cat response.json

      - name: Build output JSON
        id: build_output
        run: |
          PAGE_URL="${{ steps.build_url.outputs.page_url }}"
          jq -n \
            --arg pageTitle "$(jq -r '.data.title // empty' response.json)" \
            --arg previewUrl "$PAGE_URL" \
            '{"page-title": $pageTitle, "preview-url": $previewUrl}' \
            > output.json

          echo "Output JSON:"
          cat output.json

          echo "### Publish Screenshot Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat output.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          {
            echo "output_json<<EOF"
            cat output.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"